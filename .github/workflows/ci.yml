name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run the pure-logic test suite
        # The trained model + risk overlay are large build artifacts kept out of
        # git, so model-backed integration tests skip here (see tests/conftest.py);
        # the full suite runs locally where the artifacts are present.
        run: python -m pytest -q
